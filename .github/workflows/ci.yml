name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run backend tests
        working-directory: backend
        run: uv sync --group dev && uv run pytest

      - name: Build and smoke-test backend image
        run: |
          docker build -t fastapi-backend backend
          docker run -d -p 8000:8000 --name fastapi-test fastapi-backend
          
          echo "Waiting for FastAPI to start..."
          SUCCESS=0
          for i in {1..30}; do
            if curl -s http://localhost:8000/ > /dev/null; then
              echo "Server is up!"
              SUCCESS=1
              break
            fi
            sleep 1
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "=== SERVER FAILED TO START. DOCKER LOGS: ==="
            docker logs fastapi-test
            exit 1
          fi

          # Run the smoke tests now that it's confirmed running
          curl --fail http://localhost:8000/
          curl --fail http://localhost:8000/recipes

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build